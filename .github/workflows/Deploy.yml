name Deploy to Cloudflare Pages

on
  push
    branches
      - main  # یان master ئەگەر ناوی برانچەکەت ئەوەیە

jobs
  deploy
    runs-on ubuntu-latest
    permissions
      contents read
      deployments write
    steps
      - name Checkout
        uses actionscheckout@v4

      - name Publish to Cloudflare Pages
        uses cloudflarewrangler-action@v3
        with
          apiToken ${{ secrets.CF_API_TOKEN }}
          accountId ${{ secrets.CF_ACCOUNT_ID }}
          command pages deploy . --project-name=arkandara