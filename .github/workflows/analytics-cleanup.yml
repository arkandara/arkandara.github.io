name: "Verified daily analytics cleanup"
on:
  workflow_run:
    workflows:
      - "🌙 ئەرشیفی ڕۆژانە — safe GitHub checkpoint"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daily-archive-main
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Delete archived daily keys only after successful GitHub archive
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_DAILY_KV_NAMESPACE_ID: ${{ secrets.CF_DAILY_KV_NAMESPACE_ID }}
        run: node scripts/cleanup-archived-day.cjs
