# ============================================================
#  .github/workflows/archive-stats.yml
#
#  هەفتانە : هەر یەکشەممە 21:30 UTC = 12:30 AM عێراق
#            داتای 7 رۆژی ڕابردوو لە index.json کۆ دەکاتەوە
#
#  مانگانە : یەکەمی هەر مانگ 21:40 UTC = 12:40 AM عێراق
#            داتای **مانگی پێشوو** ئەرشیف دەکات
#            (چونکە 1ی مانگ = مانگی کۆنەکە تەواو بووە)
# ============================================================

name: 📦 ئەرشیفی هەفتانە و مانگانە

on:
  schedule:
    - cron: "30 21 * * 0"    # یەکشەممە 21:30 UTC = 12:30 AM عێراق
    - cron: "40 21 1 * *"    # 1ی هەر مانگ 21:40 UTC = 12:40 AM عێراق
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 🔄 Pull
        run: git pull --rebase

      - name: 📊 دروستکردنی ئەرشیفی هەفتانە و مانگانە
        run: |
          node - << 'JSEOF'
          const fs = require("fs");

          function isoDate(d) { return d.toISOString().slice(0,10); }

          // خوێندنەوەی index.json
          const idxPath = "archives/index.json";
          let dailyIdx = [];
          try {
              dailyIdx = JSON.parse(fs.readFileSync(idxPath, "utf8"));
          } catch(e) {
              console.log("⚠️ archives/index.json نییە");
              process.exit(0);
          }
          if (!dailyIdx.length) { console.log("⚠️ داتا نییە"); process.exit(0); }

          const now      = new Date();
          const todayStr = isoDate(now);
          console.log("📅 ئێستا:", todayStr, "| رۆژ:", dailyIdx.length);

          // =====================================================
          // هەفتانە: 7 رۆژی ڕابردوو (هەر یەکشەممە کار دەکات)
          // =====================================================
          const GITHUB_EVENT = process.env.GITHUB_EVENT_NAME || "";
          const isManual     = GITHUB_EVENT === "workflow_dispatch";
          const dayOfMonth   = now.getUTCDate();
          const dayOfWeek    = now.getUTCDay(); // 0=یەکشەممە

          // هەفتانە ئەگەر یەکشەممە بێت یان دەستی بکرێتەوە
          if (dayOfWeek === 0 || isManual) {
              const weekEnd   = todayStr;
              const weekStart = isoDate(new Date(now.getTime() - 6 * 86400000));
              const weekDays  = dailyIdx.filter(d => d.date >= weekStart && d.date <= weekEnd);

              if (weekDays.length > 0) {
                  const wData = {
                      type:        "weekly",
                      week:        weekStart + "_" + weekEnd,
                      generatedAt: now.toISOString(),
                      totalVisits: weekDays.reduce((s,d) => s + (d.totalVisits||0), 0),
                      totalClicks: weekDays.reduce((s,d) => s + (d.totalClicks||0), 0),
                      days: weekDays.map(d => ({ date: d.date, visits: d.totalVisits||0, clicks: d.totalClicks||0 }))
                  };
                  const wPath = "archives/weekly_" + weekStart + "_" + weekEnd + ".json";
                  fs.writeFileSync(wPath, JSON.stringify(wData, null, 2), "utf8");

                  // ئەندێکسی هەفتانە
                  const wIdxPath = "archives/weekly_index.json";
                  let wIdx = [];
                  try { wIdx = JSON.parse(fs.readFileSync(wIdxPath, "utf8")); } catch(e) {}
                  wIdx = wIdx.filter(x => x.week !== wData.week);
                  wIdx.unshift({
                      week: wData.week, generatedAt: wData.generatedAt,
                      totalVisits: wData.totalVisits, totalClicks: wData.totalClicks,
                      days: wData.days, file: wPath
                  });
                  if (wIdx.length > 12) wIdx = wIdx.slice(0, 12);
                  fs.writeFileSync(wIdxPath, JSON.stringify(wIdx, null, 2), "utf8"); // ← wIdx نەک wData
                  console.log("✅ هەفتانە:", weekStart, "→", weekEnd, "("+weekDays.length+" رۆژ)");
              } else {
                  console.log("⚠️ هیچ داتایەکی هەفتانە نەدۆزراوەتەوە");
              }
          }

          // =====================================================
          // مانگانە: 1ی مانگ = مانگی پێشوو تەواو بووە
          // =====================================================
          if (dayOfMonth === 1 || isManual) {
              // مانگی پێشوو
              const prevMonthDate = new Date(now.getFullYear(), now.getMonth() - 1, 1);
              const prevMonth     = isoDate(prevMonthDate).slice(0, 7); // "2026-04"

              const monthDays = dailyIdx.filter(d => d.date.startsWith(prevMonth));

              if (monthDays.length > 0) {
                  const mData = {
                      type:        "monthly",
                      month:       prevMonth,
                      generatedAt: now.toISOString(),
                      totalVisits: monthDays.reduce((s,d) => s + (d.totalVisits||0), 0),
                      totalClicks: monthDays.reduce((s,d) => s + (d.totalClicks||0), 0),
                      days: monthDays.map(d => ({ date: d.date, visits: d.totalVisits||0, clicks: d.totalClicks||0 }))
                  };
                  const mPath = "archives/monthly_" + prevMonth + ".json";
                  fs.writeFileSync(mPath, JSON.stringify(mData, null, 2), "utf8");

                  // ئەندێکسی مانگانە
                  const mIdxPath = "archives/monthly_index.json";
                  let mIdx = [];
                  try { mIdx = JSON.parse(fs.readFileSync(mIdxPath, "utf8")); } catch(e) {}
                  mIdx = mIdx.filter(x => x.month !== prevMonth);
                  mIdx.unshift({
                      month: prevMonth, generatedAt: mData.generatedAt,
                      totalVisits: mData.totalVisits, totalClicks: mData.totalClicks,
                      days: mData.days, file: mPath
                  });
                  if (mIdx.length > 24) mIdx = mIdx.slice(0, 24);
                  fs.writeFileSync(mIdxPath, JSON.stringify(mIdx, null, 2), "utf8"); // ← mIdx نەک mData
                  console.log("✅ مانگانە:", prevMonth, "("+monthDays.length+" رۆژ،", mData.totalVisits, "سەردان)");
              } else {
                  console.log("⚠️ هیچ داتایەکی مانگانە نەدۆزراوەتەوە بۆ:", prevMonth);
                  console.log("   ئەو رۆژانەی هەن:", dailyIdx.slice(0,5).map(d=>d.date).join(", "));
              }
          }
          JSEOF

      - name: 📤 Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --staged --quiet || git commit -m "📦 ئەرشیفی هەفتانە/مانگانە — $(date -u +'%Y-%m-%d')"
          git push
