# ============================================================
#  .github/workflows/archive-stats.yml
#
#  هەفتانە : هەر یەکشەممە 12:30 AM عێراق = 21:30 UTC شەوی شەممە
#            (daily-clear کاتی 21:20 کار دەکات، ئەمەش 10 خولەک دواتر)
#
#  مانگانە : یەکەمی هەر مانگ 12:40 AM عێراق = 21:40 UTC
#            (دوای daily-clear ی ئەو رۆژە)
#
#  هەر دوو داتاکەیان لە archives/index.json دەخوێننەوە
#  (ئەوەی daily-clear هەر شەو دروستی دەکات)
# ============================================================

name: 📦 ئەرشیفی هەفتانە و مانگانە

on:
  schedule:
    # یەکشەممە 21:30 UTC = 12:30 AM عێراق (0 = یەکشەممە لە cron)
    - cron: "30 21 * * 0"
    # یەکەمی هەر مانگ 21:40 UTC = 12:40 AM عێراق
    - cron: "40 21 1 * *"
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 🔄 Pull کردنی کۆتاترین گۆڕانکاری (daily-clear دەیکات)
        run: git pull --rebase

      - name: 📊 دروستکردنی ئەرشیفی هەفتانە و مانگانە
        run: |
          node - << 'JSEOF'
          const fs = require("fs");

          function isoDate(d) { return d.toISOString().slice(0,10); }

          const idxPath = "archives/index.json";
          let dailyIdx = [];
          try {
              dailyIdx = JSON.parse(fs.readFileSync(idxPath, "utf8"));
          } catch(e) {
              console.log("⚠️ archives/index.json نییە — پێویستە daily-clear پێشتر کار بکات");
              process.exit(0);
          }

          if (!dailyIdx.length) {
              console.log("⚠️ داتایەک تێدا نییە");
              process.exit(0);
          }

          const now      = new Date();
          const todayStr = isoDate(now);
          console.log("📅 ئێستا:", todayStr, "| کۆی رۆژەکان:", dailyIdx.length);

          // ================================
          // هەفتانە — ٧ رۆژی ڕابردوو
          // ================================
          const weekEnd   = todayStr;
          const wStart    = new Date(now.getTime() - 6 * 86400000);
          const weekStart = isoDate(wStart);
          const weekDays  = dailyIdx.filter(d => d.date >= weekStart && d.date <= weekEnd);

          if (weekDays.length > 0) {
              const mergeDevice = (days) => {
                  const t = { mobile:0, desktop:0, tablet:0 };
                  days.forEach(d => { const s = d.deviceStats||{}; t.mobile+=s.mobile||0; t.desktop+=s.desktop||0; t.tablet+=s.tablet||0; });
                  return t;
              };
              const mergeCity = (days) => {
                  const t = {};
                  days.forEach(d => { Object.entries(d.cityStats||{}).forEach(([c,n])=>{ t[c]=(t[c]||0)+n; }); });
                  return t;
              };
              const wData = {
                  type:        "weekly",
                  week:        `${weekStart}_${weekEnd}`,
                  generatedAt: now.toISOString(),
                  totalVisits: weekDays.reduce((s,d) => s + (d.totalVisits||0), 0),
                  totalClicks: weekDays.reduce((s,d) => s + (d.totalClicks||0), 0),
                  deviceStats: mergeDevice(weekDays),
                  cityStats:   mergeCity(weekDays),
                  days: weekDays.map(d => ({
                      date:   d.date,
                      visits: d.totalVisits || 0,
                      clicks: d.totalClicks || 0
                  }))
              };
              const wPath = `archives/weekly_${weekStart}_${weekEnd}.json`;
              fs.writeFileSync(wPath, JSON.stringify(wData, null, 2), "utf8");

              const wIdxPath = "archives/weekly_index.json";
              let wIdx = [];
              try { wIdx = JSON.parse(fs.readFileSync(wIdxPath, "utf8")); } catch(e) {}
              wIdx = wIdx.filter(x => x.week !== wData.week);
              wIdx.unshift({
                  week:        wData.week,
                  generatedAt: wData.generatedAt,
                  totalVisits: wData.totalVisits,
                  totalClicks: wData.totalClicks,
                  days:        wData.days,
                  file:        wPath
              });
              // هەمیشەیی — سنووری ژمارەی هەفتانە نییە
              fs.writeFileSync(wIdxPath, JSON.stringify(wIdx, null, 2), "utf8");
              console.log(`✅ هەفتانە: ${weekStart} → ${weekEnd} (${weekDays.length} رۆژ، ${wData.totalVisits} سەردان)`);
          } else {
              console.log("⚠️ هیچ داتایەکی هەفتانە نەدۆزراوەتەوە بۆ:", weekStart, "→", weekEnd);
          }

          // ================================
          // مانگانە — هەموو رۆژەکانی ئەم مانگە
          // ================================
          const thisMonth = todayStr.slice(0, 7);
          const monthDays = dailyIdx.filter(d => d.date.startsWith(thisMonth));

          if (monthDays.length > 0) {
              const mData = {
                  type:        "monthly",
                  month:       thisMonth,
                  generatedAt: now.toISOString(),
                  totalVisits: monthDays.reduce((s,d) => s + (d.totalVisits||0), 0),
                  totalClicks: monthDays.reduce((s,d) => s + (d.totalClicks||0), 0),
                  deviceStats: mergeDevice(monthDays),
                  cityStats:   mergeCity(monthDays),
                  days: monthDays.map(d => ({
                      date:   d.date,
                      visits: d.totalVisits || 0,
                      clicks: d.totalClicks || 0
                  }))
              };
              const mPath = `archives/monthly_${thisMonth}.json`;
              fs.writeFileSync(mPath, JSON.stringify(mData, null, 2), "utf8");

              const mIdxPath = "archives/monthly_index.json";
              let mIdx = [];
              try { mIdx = JSON.parse(fs.readFileSync(mIdxPath, "utf8")); } catch(e) {}
              mIdx = mIdx.filter(x => x.month !== thisMonth);
              mIdx.unshift({
                  month:       thisMonth,
                  generatedAt: mData.generatedAt,
                  totalVisits: mData.totalVisits,
                  totalClicks: mData.totalClicks,
                  days:        mData.days,
                  file:        mPath
              });
              // هەمیشەیی — سنووری ژمارەی مانگانە نییە
              fs.writeFileSync(mIdxPath, JSON.stringify(mData, null, 2), "utf8");
              console.log(`✅ مانگانە: ${thisMonth} (${monthDays.length} رۆژ، ${mData.totalVisits} سەردان)`);
          } else {
              console.log("⚠️ هیچ داتایەکی مانگانە نەدۆزراوەتەوە بۆ:", thisMonth);
          }
          JSEOF

      - name: 📤 Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --staged --quiet || git commit -m "📦 ئەرشیفی هەفتانە/مانگانە — $(date -u +'%Y-%m-%d')"
          git push
