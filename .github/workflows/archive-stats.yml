# ============================================================
#  .github/workflows/archive-stats.yml
#
#  مانگانە : ١ی هەر مانگ 21:40 UTC = 12:40 AM عێراق
#            ١. داتای daily_current.json کۆدەکاتەوە
#            ٢. زیادی دەکرێت بۆ archives/monthly_archive.json (تەنها کۆکردنەوە، بێ days)
#            ٣. daily_current.json سفر دەبێتەوە
#
#  ساڵانە  : ١ی ١ی هەر ساڵ 21:50 UTC = 12:50 AM عێراق
#            ١. فایلی ساڵانە لە monthly_archive.json دروست دەکات
#            ٢. yearly_index.json نوێدەکاتەوە
#            ٣. تەنها دروست دەبێت ئەگەر هەموو ١٢ مانگ بەردەست بن
# ============================================================

name: 📦 ئەرشیفی مانگانە و ساڵانە

on:
  schedule:
    - cron: "40 0 1 * *"     # UTC day 1 = Baghdad day 2 at 00:40
    - cron: "50 0 1 1 *"     # UTC Jan 1 = Baghdad Jan 2 at 00:50
  workflow_dispatch:

concurrency:
  group: daily-archive-main
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 🔄 Pull کردنی کۆتاترین گۆڕانکاری
        run: git pull --rebase

      - name: 📊 دروستکردنی ئەرشیفی مانگانە و ساڵانە
        run: |
          node - << 'JSEOF'
          const fs = require("fs");

          function isoDate(d) { return d.toISOString().slice(0,10); }

          const now      = new Date();
          const todayStr = isoDate(now);

          // ================================================================
          // مانگانە — لە daily_current.json
          // ================================================================
          // مانگی ئەرشیفکراو = مانگی ڕابردوو (پێش رۆژی ئەمرۆ)
          // چونکە ئەم جۆبە لە ١ی مانگی نوێ کار دەکات،
          // prevDay = کۆتا رۆژی مانگی ڕابردوو
          // ================================================================
          const currentPath = "archives/daily_current.json";
          const archivePath = "archives/monthly_archive.json";

          if (!fs.existsSync(currentPath)) {
            throw new Error("Missing daily_current.json; preserving archive");
          }

          let current;
          try {
            current = JSON.parse(fs.readFileSync(currentPath, "utf8"));
          } catch(e) {
            throw new Error("Invalid daily_current.json; preserving archive");
          }

          const days = current.days || [];
          if (!Array.isArray(days)) throw new Error("Invalid daily_current.days; preserving archive");
          {
            // مانگی ڕابردوو: چونکە ئەم جۆبە لە ١ی مانگی نوێ کار دەکات،
            // prevDay = دوەمین رۆژ پێش ئەمرۆ (کۆتا رۆژی مانگی ڕابردوو)
            const prevDay    = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), 0)); // رۆژی دوایی مانگی ڕابردوو
            const monthLabel = isoDate(prevDay).slice(0, 7); // e.g. "2026-05"
            const monthStart = monthLabel + "-01";
            const monthEnd   = isoDate(prevDay);
            const expectedDays = prevDay.getUTCDate();

            console.log(`📅 مانگی ئەرشیف: ${monthLabel} (${monthStart} → ${monthEnd})`);

            // FIX #3: تەنها رۆژانە لە ئەو مانگەی فیلتەر بکە — قەت رۆژی مانگی تر نەخەیە تێ
            const monthDays = days.filter(d => {
              if (!d.date) return false;
              const dm = d.date.slice(0, 7);
              return dm === monthLabel;
            });

            // Missing days are allowed. Reject malformed or conflicting available entries.
          const seen = new Set();
          for (const d of monthDays) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date) || d.date < monthStart || d.date > monthEnd ||
                seen.has(d.date) || !Number.isFinite(d.totalVisits) || d.totalVisits < 0 ||
                !Number.isFinite(d.totalClicks) || d.totalClicks < 0 ||
                !d.clicks || typeof d.clicks !== "object" || Array.isArray(d.clicks) ||
                Object.values(d.clicks).some(v => !Number.isFinite(v) || v < 0) ||
                Object.values(d.clicks).reduce((sum,v)=>sum+v,0) !== d.totalClicks) {
              throw new Error("Invalid or duplicate daily entry for "+monthLabel+"; preserving archive");
            }
            seen.add(d.date);
          }
          console.log("Monthly coverage:",monthDays.length+"/"+expectedDays,"days; missing days permitted");
          if (monthDays.length > 0) {
              const mergeDevice = (ds) => {
                const t = { mobile:0, desktop:0, tablet:0 };
                ds.forEach(d => {
                  const s = d.deviceStats || {};
                  t.mobile  += s.mobile  || 0;
                  t.desktop += s.desktop || 0;
                  t.tablet  += s.tablet  || 0;
                });
                return t;
              };
              const mergeCity = (ds) => {
                const t = {};
                ds.forEach(d => {
                  Object.entries(d.cityStats || {}).forEach(([c,n]) => { t[c] = (t[c]||0)+n; });
                });
                return t;
              };
              const mergeClicks = (ds) => {
                const t = {};
                ds.forEach(d => {
                  Object.entries(d.clicks || {}).forEach(([k,v]) => { t[k] = (t[k]||0)+v; });
                });
                return t;
              };

              // FIX #1: هیچ "days" ناخرێتە ئەرشیفی مانگانە — تەنها کۆکردنەوە
              const mData = {
                month:       monthLabel,
                generatedAt: now.toISOString(),
                totalVisits: monthDays.reduce((s,d) => s+(d.totalVisits||0), 0),
                totalClicks: monthDays.reduce((s,d) => s+(d.totalClicks||0), 0),
                monthsCount: monthDays.length,
                expectedDays: expectedDays,
                missingDays: expectedDays - monthDays.length,
                complete: monthDays.length === expectedDays,
                deviceStats: mergeDevice(monthDays),
                cityStats:   mergeCity(monthDays),
                clicks:      mergeClicks(monthDays)
                // days: بڵاوت نەکەوە — FIX #1
              };

              let archive = { months: [] };
              try { archive = JSON.parse(fs.readFileSync(archivePath, "utf8")); } catch(e) {}
              if (!Array.isArray(archive.months)) archive.months = [];

              // Existing rollups are never silently replaced by an automatic run.
              if (archive.months.some(m => m.month === mData.month)) {
                console.log(`Monthly archive ${mData.month} already exists; leaving it unchanged`);
              } else {
              archive.months = archive.months.filter(m => m.month !== mData.month);
              archive.months.push(mData);
              archive.months.sort((a,b) => a.month.localeCompare(b.month));

              fs.writeFileSync(archivePath, JSON.stringify(archive, null, 2), "utf8");
              console.log(`✅ مانگانە: ${monthLabel} (${monthDays.length} رۆژ، ${mData.totalVisits} سەردان) → monthly_archive.json`);

              }
              // Retain current month plus the last three completed months.
              // Prune only dates whose month has a confirmed summary.
              const cutoff = new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth()-3,1)).toISOString().slice(0,7);
              const completed = new Set(archive.months.map(m => m.month));
              const retained = days.filter(d => !(d.date && d.date.slice(0,7)<cutoff && completed.has(d.date.slice(0,7))));
              if (retained.length !== days.length) {
                current.days = retained;
                current.updatedAt = now.toISOString();
                fs.writeFileSync(currentPath,JSON.stringify(current,null,2),"utf8");
                console.log("Pruned archived daily records:",days.length-retained.length);
              }
            } else {
              console.log(`No daily records for ${monthLabel}; writing zero-count monthly summary`);
              // No daily entries: still record an explicitly incomplete zero-count month.
              let archive = { months: [] };
              try { archive = JSON.parse(fs.readFileSync(archivePath, "utf8")); } catch(e) {}
              if (!Array.isArray(archive.months)) archive.months = [];
              if (!archive.months.some(m=>m.month===monthLabel)) {
                archive.months.push({month:monthLabel,generatedAt:now.toISOString(),totalVisits:0,totalClicks:0,monthsCount:0,expectedDays,missingDays:expectedDays,complete:false,deviceStats:{mobile:0,desktop:0,tablet:0},cityStats:{},clicks:{}});
                archive.months.sort((a,b)=>a.month.localeCompare(b.month));
                fs.writeFileSync(archivePath,JSON.stringify(archive,null,2),"utf8");
              }
            }
          }

          // ================================================================
          // ساڵانە — تەنها ١ی ١ی هەر ساڵ
          // ================================================================
          const isJan1 = (now.getUTCMonth() === 0 && now.getUTCDate() === 1);
          if (!isJan1) {
            console.log("ℹ️ ئەمڕۆ ١ی ١ نییە — ساڵانە نادروستبێت");
            process.exit(0);
          }

          const lastYear = now.getUTCFullYear() - 1;
          console.log(`📅 دروستکردنی ئەرشیفی ساڵانەی ${lastYear}...`);

          let archive2 = { months: [] };
          try { archive2 = JSON.parse(fs.readFileSync(archivePath, "utf8")); } catch(e) {}

          const yearMonths = (archive2.months || []).filter(m =>
            (m.month || "").startsWith(String(lastYear))
          );

          // FIX #4: دڵنیاببە هەموو ١٢ مانگ بەردەستن پێش دروستکردنی ساڵانە
          const expectedMonths = Array.from({length:12},(_,i)=>String(lastYear)+"-"+String(i+1).padStart(2,"0"));
          if (yearMonths.length !== 12 || !expectedMonths.every(m=>yearMonths.some(x=>x.month===m)) || yearMonths.some(m=>!Number.isSafeInteger(m.totalVisits)||!Number.isSafeInteger(m.totalClicks)||!m.clicks||Object.values(m.clicks).reduce((a,b)=>a+b,0)!==m.totalClicks)) {
            console.log(`⚠️ ساڵانە نادروستبێت: ${yearMonths.length} مانگ بەردەستە، پێویستە ١٢ مانگ بێت`);
            console.log("   مانگە بەردەستەکان:", yearMonths.map(m => m.month).join(", ") || "(هیچ)");
            process.exit(0);
          }

          // FIX #2: ساڵانە تەنها کۆکردنەوەی مانگانە دەکات — هیچ days تێدا ناخرێت
          const yDevice = { mobile:0, desktop:0, tablet:0 };
          const yCity   = {};
          const yClicks = {};

          yearMonths.forEach(m => {
            const ds = m.deviceStats || {};
            yDevice.mobile  += ds.mobile  || 0;
            yDevice.desktop += ds.desktop || 0;
            yDevice.tablet  += ds.tablet  || 0;
            Object.entries(m.cityStats  || {}).forEach(([c,n]) => { yCity[c]   = (yCity[c]  ||0)+n; });
            Object.entries(m.clicks     || {}).forEach(([k,v]) => { yClicks[k] = (yClicks[k]||0)+v; });
          });

          // FIX #2: ساڵانە = تەنها کۆکردنەوە، بێ days، بێ رۆژانە
          const yData = {
            type:        "yearly",
            year:        String(lastYear),
            generatedAt: now.toISOString(),
            totalVisits: yearMonths.reduce((s,m) => s+(m.totalVisits||0), 0),
            totalClicks: yearMonths.reduce((s,m) => s+(m.totalClicks||0), 0),
            monthsCount: 12,
            deviceStats: yDevice,
            cityStats:   yCity,
            clicks:      yClicks,
            months: yearMonths.map(m => ({
              month:  m.month,
              visits: m.totalVisits || 0,
              clicks: m.totalClicks || 0
            }))
            // days: بڵاوت نەکەوە — FIX #2
          };

          const yPath = `archives/yearly_${lastYear}.json`;
          if (fs.existsSync(yPath)) throw new Error(`Yearly archive ${yPath} already exists; refusing overwrite`);
          fs.writeFileSync(yPath, JSON.stringify(yData, null, 2), "utf8");

          const yIdxPath = "archives/yearly_index.json";
          let yIdx = [];
          try {
            const _y = JSON.parse(fs.readFileSync(yIdxPath, "utf8"));
            yIdx = Array.isArray(_y) ? _y : [];
          } catch(e) {}

          yIdx = yIdx.filter(x => x.year !== yData.year);
          yIdx.unshift({
            year:        yData.year,
            generatedAt: yData.generatedAt,
            totalVisits: yData.totalVisits,
            totalClicks: yData.totalClicks,
            monthsCount: 12,
            months:      yData.months,
            file:        yPath
          });
          fs.writeFileSync(yIdxPath, JSON.stringify(yIdx, null, 2), "utf8");
          archive2.months = archive2.months.filter(m=>!yearMonths.some(y=>y.month===m.month));
          fs.writeFileSync(archivePath,JSON.stringify(archive2,null,2),"utf8");
          console.log(`Yearly ${lastYear} created; twelve monthly sources pruned in same commit`);
          JSEOF

      - name: 📤 Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --staged --quiet || git commit -m "📦 ئەرشیفی مانگانە/ساڵانە — $(date -u +'%Y-%m-%d')"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
