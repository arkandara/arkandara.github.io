# ============================================================
#  .github/workflows/daily-clear.yml
#  هەر شەو 12:20 AM عێراق (UTC+3) = 21:20 UTC:
#  ١. داتای رۆژ لە KV دەخوێنێتەوە
#  ٢. رێزێکی نوێ زیاد دەکات بۆ archives/daily_current.json
#  ٣. هەموو ئامارەکانی KV سفر دەبنەوە
#
#  FIX #5 — مەترسی مانگی تر:
#  ئەم جۆبە هەر شەو کار دەکات، نەک ١ی مانگ تەنها.
#  ئەگەر ئەمرۆ ١ی مانگ بووە (UTC)، ئەم جۆبە تەنها
#  داتای ئەمرۆ دەخاتە daily_current.json (مانگی نوێ).
#  سفرکردنەوەی مانگی ڕابردوو بەپێچەوانەوە کاری archive-stats.yml-ە
#  کە لە 21:40 کار دەکات — ٢٠ خولەک پاش ئەم جۆبە.
#  بۆیە ئۆردەری دروستە:
#    21:20 UTC → daily-clear: KV دەخوێنێت، daily_current.json نوێدەکات، KV سفر دەکاتەوە
#    21:40 UTC → archive-stats: daily_current.json دەخوێنێت، مانگانە دروست دەکات، سفر دەکاتەوە
# ============================================================

name: 🌙 ئەرشیفی شەوانە و سفرکردنەوەی ئامارەکان

on:
  schedule:
    - cron: "20 21 * * *"   # 21:20 UTC = 12:20 AM عێراق (UTC+3)
  workflow_dispatch:

jobs:
  archive-and-clear:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 🔄 Pull کردنی کۆتاترین گۆڕانکاری
        run: git pull --rebase

      - name: 📡 ئەرشیفکردن و سفرکردنەوەی KV
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          CF_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          node - << 'JSEOF'
          const https = require("https");
          const fs    = require("fs");

          const ACCOUNT   = process.env.CF_ACCOUNT_ID;
          const TOKEN     = process.env.CF_API_TOKEN;
          const NAMESPACE = process.env.CF_NAMESPACE_ID;
          const BASE      = `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/storage/kv/namespaces/${NAMESPACE}`;

          function cfRequest(method, key, body) {
            return new Promise((res, rej) => {
              const opts = {
                method: method || "GET",
                headers: { Authorization: `Bearer ${TOKEN}` }
              };
              if (body !== undefined) {
                const buf = Buffer.from(String(body));
                opts.headers["Content-Type"]   = "text/plain";
                opts.headers["Content-Length"] = buf.length;
              }
              const req = https.request(
                `${BASE}/values/${encodeURIComponent(key)}`, opts,
                (r) => { let b=""; r.on("data",d=>b+=d); r.on("end",()=>res(b)); }
              );
              req.on("error", rej);
              if (body !== undefined) req.write(Buffer.from(String(body)));
              req.end();
            });
          }

          const cfGet    = (key)      => cfRequest("GET",    key);
          const cfDelete = (key)      => cfRequest("DELETE", key);
          const cfPut    = (key, val) => cfRequest("PUT",    key, val);

          function safeJson(raw, def)  { try { return JSON.parse(raw); } catch(e) { return def; } }
          function safeArray(raw)      { try { const p = JSON.parse(raw); return Array.isArray(p) ? p : []; } catch(e) { return []; } }
          function isoDate(d)          { return d.toISOString().slice(0,10); }

          async function main() {
            const now         = new Date();
            // FIX #5: archiveDate بەرپرسە لە رۆژی ئەمرۆ (UTC) — هەمیشە دروستە
            // چونکە ئەم جۆبە پێش archive-stats کار دەکات، داتای KV
            // بۆ مانگی دروست دەچێت
            const archiveDate = isoDate(now);
            const thisMonth   = archiveDate.slice(0, 7);
            console.log("📅 رۆژی ئەرشیف:", archiveDate, "| مانگ:", thisMonth);

            // ---- ١. خوێندنەوەی داتا لە KV ----
            const clickLabels = safeArray(await cfGet("meta:clicks_list"));
            const clicks = {};
            for (const lbl of clickLabels) {
              const v = await cfGet("click:" + lbl);
              if (v && !isNaN(+v)) clicks[lbl] = +v;
            }
            const totalVisits   = +(await cfGet("meta:total_visits")   || "0");
            const totalTextarea = +(await cfGet("meta:total_textarea") || "0");
            const sessions      = safeArray(await cfGet("visits:" + archiveDate));

            // ---- ٢. حیسابکردنی deviceStats و cityStats ----
            const deviceStats = { mobile: 0, desktop: 0, tablet: 0 };
            const cityStats   = {};
            sessions.forEach(s => {
              const d = s.device || "";
              if      (d.includes("تابلێت") || d.includes("📟")) deviceStats.tablet++;
              else if (d.includes("موبایل") || d.includes("📱")) deviceStats.mobile++;
              else                                                  deviceStats.desktop++;
              const city = (s.city && s.city !== "---")
                ? s.city
                : ((s.country && s.country !== "---") ? s.country : "نەناسراو");
              cityStats[city] = (cityStats[city] || 0) + 1;
            });

            const totalClicks = Object.values(clicks).reduce((s,v) => s+v, 0);

            if (!fs.existsSync("archives")) fs.mkdirSync("archives");

            // ---- ٣. زیادکردن بۆ daily_current.json ----
            const currentPath = "archives/daily_current.json";
            let current = { type: "daily_current", month: thisMonth, updatedAt: "", days: [] };

            if (fs.existsSync(currentPath)) {
              try { current = JSON.parse(fs.readFileSync(currentPath, "utf8")); } catch(e) {}
            }

            // FIX #6: daily-clear قەت نابێت days سفر بکاتەوە یان بیسڕێتەوە،
            // تەنانەت ئەگەر current.month لەگەڵ thisMonth یەکسان نەبێت.
            // ئەگەر ئەمرۆ ١ی مانگە، ڕۆژانی مانگی ڕابردوو (بۆ نموونە حوزەیران)
            // هێشتا لە داخڵی daysماونەتەوە و پێویستە بمێننەوە، چونکە
            // archive-stats.yml لە 21:40 (٢٠ خولەک دواتر) پێویستی پێیانە
            // بۆ دروستکردنی ئەرشیفی مانگانە. ئەگەر لێرە بسڕدرێنەوە،
            // archive-stats هیچ داتایەک بۆ مانگی ڕابردوو نادۆزێتەوە و
            // ئەرشیفی مانگانە دروست نابێت.
            // تەنها current.month نوێ دەکەینەوە (ئاماژەیە، کاریگەری
            // لەسەر فلتەرکردنی archive-stats نییە چونکە ئەو خۆی
            // بەپێی d.date فلتەر دەکات نەک بەپێی current.month).
            current.month = thisMonth;

            // سرینەوەی ئەگەر ئەمرۆ پێشتر تۆماربووە (ئەگەر workflow_dispatch دووجار کراوەتەوە)
            current.days = (current.days || []).filter(d => d.date !== archiveDate);
            current.days.push({
              date:         archiveDate,
              generatedAt:  now.toISOString(),
              totalVisits,
              totalClicks,
              totalTextarea,
              clicks,
              deviceStats,
              cityStats
            });
            current.days.sort((a,b) => a.date.localeCompare(b.date));
            current.updatedAt = now.toISOString();

            fs.writeFileSync(currentPath, JSON.stringify(current, null, 2), "utf8");
            console.log("✅ daily_current.json نوێکرایەوە — رۆژ:", archiveDate, "| کۆی رۆژ:", current.days.length);

            // ---- ٤. سفرکردنەوەی KV ----
            console.log("🗑️ سفرکردنەوەی KV...");
            await cfDelete("visits:"    + archiveDate);
            await cfDelete("snapshots:" + archiveDate);
            await cfDelete("textarea:"  + archiveDate);
            await cfPut("meta:total_visits",   "0");
            await cfPut("meta:total_textarea", "0");
            for (const lbl of clickLabels) await cfDelete("click:" + lbl);
            await cfDelete("meta:clicks_list");
            console.log("✅ KV سفر بووەوە — ئامادەی رۆژی نوێ");
          }

          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: 📤 Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --staged --quiet || git commit -m "🌙 ئەرشیفی رۆژانە — $(date -u +'%Y-%m-%d')"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
