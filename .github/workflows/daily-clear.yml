# ============================================================
#  .github/workflows/daily-clear.yml
#  هەر شەو 12:20 AM عێراق (UTC+3) = 21:20 UTC:
#  ١. داتای رۆژ لە KV دەخوێنێتەوە
#  ٢. رێزێکی نوێ زیاد دەکات بۆ archives/daily_current.json
#  ٣. هەموو ئامارەکانی KV سفر دەبنەوە
#
#  FIX #5 — مەترسی مانگی تر:
#  ئەم جۆبە هەر شەو کار دەکات، نەک ١ی مانگ تەنها.
#  ئەگەر ئەمرۆ ١ی مانگ بووە (UTC)، ئەم جۆبە تەنها
#  داتای ئەمرۆ دەخاتە daily_current.json (مانگی نوێ).
#  سفرکردنەوەی مانگی ڕابردوو بەپێچەوانەوە کاری archive-stats.yml-ە
#  کە لە 21:40 کار دەکات — ٢٠ خولەک پاش ئەم جۆبە.
#  بۆیە ئۆردەری دروستە:
#    21:20 UTC → daily-clear: KV دەخوێنێت، daily_current.json نوێدەکات، KV سفر دەکاتەوە
#    21:40 UTC → archive-stats: daily_current.json دەخوێنێت، مانگانە دروست دەکات، سفر دەکاتەوە
# ============================================================

name: 🌙 ئەرشیفی ڕۆژانە — safe GitHub checkpoint

on:
  schedule:
    - cron: "20 0 * * *"   # 21:20 UTC = 12:20 AM عێراق (UTC+3)
  workflow_dispatch:

jobs:
  archive-and-clear:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-archive-main
      cancel-in-progress: false

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 🔄 Pull کردنی کۆتاترین گۆڕانکاری
        run: git pull --rebase

      - name: 📡 ئەرشیفکردنی ڕۆژی تەواوبوو لە KV
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          CF_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          node - << 'JSEOF'
          const https = require("https");
          const fs = require("fs");
          const account = process.env.CF_ACCOUNT_ID, token = process.env.CF_API_TOKEN;
          const namespace = process.env.CF_NAMESPACE_ID;
          if (![account,token,namespace].every(Boolean)) throw new Error("Missing Cloudflare credentials");
          const base = `https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${namespace}`;
          function request(method,key) {
            return new Promise((resolve,reject)=>{
              const req=https.request(`${base}/values/${encodeURIComponent(key)}`,{
                method,headers:{Authorization:`Bearer ${token}`}
              },res=>{
                let value="";
                res.on("data",chunk=>value+=chunk);
                res.on("end",()=>{
                  if(method==="GET" && res.statusCode===404)return resolve(null);
                  if(res.statusCode<200 || res.statusCode>=300)return reject(new Error(`KV ${method} ${key}: HTTP ${res.statusCode}`));
                  resolve(value);
                });
              });
              req.setTimeout(20000,()=>req.destroy(new Error("KV timeout")));
              req.on("error",reject);
              req.end();
            });
          }
          const get=key=>request("GET",key);
          function array(raw,key) {
            if(raw===null)return [];
            const value=JSON.parse(raw);
            if(!Array.isArray(value))throw new Error("Invalid array: "+key);
            return value;
          }
          function counter(raw,key) {
            if(raw===null)return 0;
            const value=Number(raw);
            if(!Number.isSafeInteger(value)||value<0)throw new Error("Invalid counter: "+key);
            return value;
          }
          function date(d){return d.toISOString().slice(0,10);}
          async function readD1(day) {
            const id=process.env.CF_D1_DATABASE_ID;
            if(!id)return null; // Explicitly configured migration only.
            const sql="SELECT kind, label, count FROM track_daily_counts WHERE day = ?";
            const payload=JSON.stringify({sql,params:[day]});
            const endpoint=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${encodeURIComponent(id)}/query`;
            return new Promise((resolve,reject)=>{
              const req=https.request(endpoint,{method:"POST",headers:{
                Authorization:`Bearer ${token}`,"Content-Type":"application/json",
                "Content-Length":Buffer.byteLength(payload)
              }},res=>{
                let body="";res.on("data",c=>body+=c);
                res.on("end",()=>{
                  if(res.statusCode!==200)return reject(new Error("D1 HTTP "+res.statusCode));
                  let data;try{data=JSON.parse(body);}catch{return reject(new Error("Invalid D1 JSON"));}
                  if(!data.success||!Array.isArray(data.result)||!data.result[0]?.success)
                    return reject(new Error("D1 query failed"));
                  const rows=data.result[0].results;
                  if(!Array.isArray(rows))return reject(new Error("Invalid D1 rows"));
                  if(rows.length===0)return reject(new Error("No D1 rows for archived day; refusing empty snapshot"));
                  const counts={visit:0,textarea:0,clicks:{}};
                  for(const row of rows){
                    const n=Number(row.count);
                    if(!Number.isSafeInteger(n)||n<0)return reject(new Error("Invalid D1 count"));
                    if(row.kind==="visit"&&row.label==="")counts.visit=n;
                    else if(row.kind==="textarea"&&row.label==="")counts.textarea=n;
                    else if(row.kind==="click"&&typeof row.label==="string")counts.clicks[row.label]=n;
                  }
                  if(counts.visit===0&&counts.textarea===0&&Object.keys(counts.clicks).length===0)
                    return reject(new Error("D1 day has no supported analytics counters"));
                  resolve(counts);
                });
              });
              req.setTimeout(20000,()=>req.destroy(new Error("D1 timeout")));
              req.on("error",reject);req.end(payload);
            });
          }

          async function main(){
            // The UTC day must be complete before it can be archived.
            const now=new Date();
            const yesterday=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()-1));
            const day=date(yesterday), month=day.slice(0,7);
            const labels=array(await get("meta:clicks_list"),"meta:clicks_list");
            if(labels.some(x=>typeof x!=="string"||!x||x.length>120)||new Set(labels).size!==labels.length)throw new Error("Invalid click labels");
            const clicks={};
            for(const label of labels){
              const key=`daily:${day}:click:${label}`;
              const n=counter(await get(key),key);
              if(n)clicks[label]=n;
            }
            const totalVisits=counter(await get(`daily:${day}:visit`),"daily visits");
            const totalTextarea=counter(await get(`daily:${day}:textarea`),"daily textarea");
            const sessions=array(await get("visits:"+day),"visits");
            const deviceStats={mobile:0,desktop:0,tablet:0},cityStats={};
            for(const session of sessions){
              if(!session||typeof session!=="object")throw new Error("Invalid visit");
              const device=String(session.device||"");
              if(device.includes("تابلێت")||device.includes("📟"))deviceStats.tablet++;
              else if(device.includes("موبایل")||device.includes("📱"))deviceStats.mobile++;
              else deviceStats.desktop++;
              const city=session.city&&session.city!=="---"?session.city:(session.country&&session.country!=="---"?session.country:"نەناسراو");
              cityStats[city]=(cityStats[city]||0)+1;
            }
            // The old writer only retains the latest 500 visit records. Do not
            // misrepresent these as a complete demographic breakdown.
            const d1=await readD1(day);
            // During migration D1 may contain only part of a day. Never
            // replace a larger legacy counter with a smaller D1 counter.
            if(d1){
              const kvClicks=Object.values(clicks).reduce((sum,n)=>sum+n,0);
              const d1Clicks=Object.values(d1.clicks).reduce((sum,n)=>sum+n,0);
              if(d1.visit<totalVisits||d1.textarea<totalTextarea||d1Clicks<kvClicks)
                throw new Error("D1 counters lag KV for "+day+"; refusing incomplete archive");
            }
            // Once configured, never archive a potentially incomplete KV count.
            const archivedClicks=d1?d1.clicks:clicks;
            const totalClicks=Object.values(archivedClicks).reduce((sum,n)=>sum+n,0);
            const archivedVisits=d1?d1.visit:totalVisits;
            const archivedTextarea=d1?d1.textarea:totalTextarea;
            const file="archives/daily_current.json";
            const current=fs.existsSync(file)?JSON.parse(fs.readFileSync(file,"utf8")):{type:"daily_current",month,updatedAt:"",days:[]};
            if(!Array.isArray(current.days))throw new Error("Invalid archive");
            // Existing same-day/future entries indicate an incomplete or
            // manually generated snapshot. Never silently accept them as final.
            const today=date(new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())));
            const premature=current.days.filter(entry=>typeof entry.date==="string"&&entry.date>=today);
            if(premature.length)
              throw new Error("Premature daily archive entries require reconciliation: "+premature.map(x=>x.date).join(", "));

            if(current.days.some(entry=>entry.date===day)){
              // A rerun must not overwrite a previously committed archive.
              // Successful checkout of this file means the archived day is durable.
              console.log("Already archived: "+day+"; no overwrite");
              return;
            }
            // Fail closed for dates before the new date-scoped counters existed.
            // Such dates require reconciliation, not silently archiving zeroes.
            if(archivedVisits===0&&totalClicks===0&&archivedTextarea===0&&sessions.length===0)throw new Error("No daily data; refusing empty archive");
            if(archivedVisits<sessions.length)throw new Error("Visit counter smaller than sessions; possible migration gap");
            current.days.push({date:day,generatedAt:now.toISOString(),source:d1?"d1":"kv",totalVisits:archivedVisits,totalClicks,totalTextarea:archivedTextarea,clicks:archivedClicks,deviceStats,cityStats});
            current.days.sort((x,y)=>x.date.localeCompare(y.date));
            current.month=month;
            current.updatedAt=now.toISOString();
            fs.mkdirSync("archives",{recursive:true});
            fs.writeFileSync(file,JSON.stringify(current,null,2),"utf8");
            console.log(`Archived ${day} from ${d1?"D1":"KV"}: ${archivedVisits} visits, ${totalClicks} clicks; KV remains unchanged`);
          }
          main().catch(error=>{console.error(error);process.exit(1);});
          JSEOF

      - name: 📤 Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --staged --quiet || git commit -m "🌙 ئەرشیفی رۆژانە — $(date -u +'%Y-%m-%d')"
          git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git

      # Run only after the GitHub push succeeds. Delete completed-day event
      # payloads; never delete cumulative dashboard counters or live-day keys.
      - name: 🧹 پاککردنەوەی داتای ڕۆژی ئەرشیفکراو لە KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          node - << 'JSEOF'
          const https=require("https");
          const fs=require("fs");
          const now=new Date();
          const day=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()-1)).toISOString().slice(0,10);
          const archive=JSON.parse(fs.readFileSync("archives/daily_current.json","utf8"));
          const entry=archive.days.find(d=>d.date===day);
          if(!entry)throw new Error("Day not present in committed archive; refusing cleanup");
          const base=`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT_ID}/storage/kv/namespaces/${process.env.CF_NAMESPACE_ID}/values/`;
          // Raw visit/textarea/snapshot payloads are not in the aggregate archive.
          // Preserve them; only completed-day aggregate counters are eligible.
          const keys=["daily:"+day+":visit","daily:"+day+":textarea",
            ...Object.keys(entry.clicks||{}).map(label=>"daily:"+day+":click:"+label)];
          // Only date-scoped keys for an archived, completed UTC day.
          // Never delete global totals or settings needed by the dashboard.
          async function del(key){
            return new Promise((resolve,reject)=>{
              const req=https.request(base+encodeURIComponent(key),{
                method:"DELETE",headers:{Authorization:"Bearer "+process.env.CF_API_TOKEN}
              },res=>{
                let body="";res.on("data",c=>body+=c);
                res.on("end",()=>res.statusCode>=200&&res.statusCode<300?resolve():reject(new Error("KV delete "+key+": HTTP "+res.statusCode)));
              });
              req.setTimeout(20000,()=>req.destroy(new Error("KV timeout")));
              req.on("error",reject);req.end();
            });
          }
          // Never delete counters on a rerun if the archive snapshot is stale.
          // Date-scoped counters have an eight-day TTL as a fallback.
          // Re-read every archived counter before deletion. A late write,
          // stale snapshot, or new label must not be silently discarded.
          async function read(key){
            return new Promise((resolve,reject)=>{
              const req=https.request(base+encodeURIComponent(key),{
                method:"GET",headers:{Authorization:"Bearer "+process.env.CF_API_TOKEN}
              },res=>{
                let body="";res.on("data",c=>body+=c);
                res.on("end",()=>{
                  if(res.statusCode===404)return resolve(null);
                  if(res.statusCode!==200)return reject(new Error("KV read "+key+": HTTP "+res.statusCode));
                  resolve(body);
                });
              });
              req.setTimeout(20000,()=>req.destroy(new Error("KV timeout")));
              req.on("error",reject);req.end();
            });
          }
          const prefix="daily:"+day+":click:";
          for(const key of keys){
            const expected=key==="daily:"+day+":visit"?entry.totalVisits:
              key==="daily:"+day+":textarea"?entry.totalTextarea:
              entry.clicks[key.slice(prefix.length)];
            const actual=await read(key);
            if(actual===null)continue;
            if(!Number.isSafeInteger(Number(actual))||Number(actual)!==expected)
              throw new Error("Archived counter differs from KV: "+key+"; refusing deletion");
          }
          // KV has no atomic compare-and-delete: another write could occur
          // between the check and delete. Until the writer is migrated to an
          // atomic store, automatic deletion is disabled to prevent data loss.
          console.log("Verified archived counters; cleanup deferred: KV compare-and-delete is not atomic");

          console.log("No KV keys deleted for "+day);
          JSEOF

