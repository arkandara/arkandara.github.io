# ============================================================
#  .github/workflows/archive-stats.yml
#  هەفتانە ئامارەکان لە Cloudflare KV بخوێنەوە و
#  بیکە JSON + CSV و لە /archives/ پاشەکەوت بکە
# ============================================================

name: 📦 Archive Weekly Stats

on:
  schedule:
    # هەر یەکشەممە کاتژمێر ٠٢:٠٠ UTC
    - cron: "0 2 * * 0"
  workflow_dispatch: # دەستی ئەجراکردنیش پێوەیەتی

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📡 Fetch stats from Cloudflare KV
        id: fetch
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:  ${{ secrets.CF_API_TOKEN }}
          CF_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          node - <<'EOF'
          const https = require("https");
          const fs    = require("fs");

          const ACCOUNT   = process.env.CF_ACCOUNT_ID;
          const TOKEN     = process.env.CF_API_TOKEN;
          const NAMESPACE = process.env.CF_NAMESPACE_ID;

          const BASE = `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/storage/kv/namespaces/${NAMESPACE}`;

          // ---- یارمەتیدەر: fetch بەپێی node ----
          async function cfGet(key) {
              return new Promise((resolve, reject) => {
                  const url = `${BASE}/values/${encodeURIComponent(key)}`;
                  const req = https.request(url, {
                      headers: { Authorization: `Bearer ${TOKEN}` }
                  }, (res) => {
                      let body = "";
                      res.on("data", d => body += d);
                      res.on("end", () => resolve(body));
                  });
                  req.on("error", reject);
                  req.end();
              });
          }

          async function cfList(prefix) {
              return new Promise((resolve, reject) => {
                  const url = `${BASE}/keys?prefix=${encodeURIComponent(prefix)}&limit=100`;
                  const req = https.request(url, {
                      headers: { Authorization: `Bearer ${TOKEN}`, "Content-Type": "application/json" }
                  }, (res) => {
                      let body = "";
                      res.on("data", d => body += d);
                      res.on("end", () => {
                          try { resolve(JSON.parse(body)); }
                          catch(e) { reject(e); }
                      });
                  });
                  req.on("error", reject);
                  req.end();
              });
          }

          // ---- خوێندنەوەی داتا ----
          async function main() {
              // کلیکەکان
              const clicksListRaw = await cfGet("meta:clicks_list");
              const clickLabels   = JSON.parse(clicksListRaw || "[]");
              const clicks = {};
              for (const label of clickLabels) {
                  const val = await cfGet("click:" + label);
                  if (val && !isNaN(parseInt(val))) clicks[label] = parseInt(val);
              }

              // گشتی سەردانەکان
              const totalVisits   = parseInt(await cfGet("meta:total_visits")   || "0");
              const totalTextarea = parseInt(await cfGet("meta:total_textarea") || "0");

              // سەردانەکانی ٧ رۆژی ڕابردوو
              const sessions = [];
              for (let i = 0; i < 7; i++) {
                  const d = new Date();
                  d.setDate(d.getDate() - i);
                  const dateStr = d.toISOString().slice(0, 10);
                  const raw = await cfGet("visits:" + dateStr);
                  try {
                      const dayData = JSON.parse(raw || "[]");
                      sessions.push(...dayData.map(s => ({ ...s, date: dateStr })));
                  } catch(e) {}
              }

              // Textarea ئەمرۆ
              const txRaw = await cfGet("textarea:" + new Date().toISOString().slice(0, 10));
              let textareaToday = [];
              try { textareaToday = JSON.parse(txRaw || "[]"); } catch(e) {}

              // ---- داتای ئەرشیف ----
              const weekEnd   = new Date().toISOString().slice(0, 10);
              const weekStart = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
              const archiveData = {
                  week:        `${weekStart}_${weekEnd}`,
                  generatedAt: new Date().toISOString(),
                  totalVisits,
                  totalTextarea,
                  clicks,
                  sessions,
                  textareaToday
              };

              // ---- پاشەکەوتکردن: JSON ----
              const dir = "archives";
              if (!fs.existsSync(dir)) fs.mkdirSync(dir);
              const filename = `${dir}/stats_${weekStart}_${weekEnd}`;
              fs.writeFileSync(`${filename}.json`, JSON.stringify(archiveData, null, 2), "utf8");

              // ---- پاشەکەوتکردن: CSV (کلیکەکان) ----
              let csv = "Label,Count\n";
              Object.entries(clicks)
                  .sort((a, b) => b[1] - a[1])
                  .forEach(([label, count]) => {
                      csv += `"${label.replace(/"/g, '""')}",${count}\n`;
                  });
              csv += "\n\nDate,City,Country,Device\n";
              sessions.forEach(s => {
                  csv += `"${s.time || ""}","${s.city || ""}","${s.country || ""}","${s.device || ""}"\n`;
              });
              fs.writeFileSync(`${filename}.csv`, csv, "utf8");

              // ---- نوێکردنەوەی index.json ----
              const indexPath = `${dir}/index.json`;
              let index = [];
              if (fs.existsSync(indexPath)) {
                  try { index = JSON.parse(fs.readFileSync(indexPath, "utf8")); } catch(e) {}
              }
              index.unshift({
                  week:        archiveData.week,
                  generatedAt: archiveData.generatedAt,
                  totalVisits,
                  totalClicks: Object.values(clicks).reduce((s,v)=>s+v,0),
                  fileJson:    `${filename}.json`,
                  fileCsv:     `${filename}.csv`
              });
              // تەنها ١٢ هەفتە بپارێزە
              if (index.length > 12) index = index.slice(0, 12);
              fs.writeFileSync(indexPath, JSON.stringify(index, null, 2), "utf8");

              console.log("✅ ئەرشیف ئامادە کرا:", filename);
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: 📤 Commit and push archives
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --staged --quiet || git commit -m "📦 ئەرشیفی هەفتانەی ئامارەکان — $(date -u +'%Y-%m-%d')"
          git push
