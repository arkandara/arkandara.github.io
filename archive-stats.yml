# ============================================================
#  .github/workflows/archive-stats.yml
#  هەفتانە (یەکشەممە) و مانگانە (یەکەمی هەر مانگ):
#  ئامارەکان لە archives/index.json دەخوێنێتەوە و
#  فایلی هەفتانە/مانگانە دروست دەکات
# ============================================================

name: 📦 ئەرشیفی هەفتانە و مانگانە

on:
  schedule:
    # هەر یەکشەممە کاتژمێر 22:00 UTC (١ بەیانی عێراق)
    - cron: "0 22 * * 0"
    # یەکەمی هەر مانگێک کاتژمێر 22:30 UTC
    - cron: "30 22 1 * *"
  workflow_dispatch:

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 📊 دروستکردنی ئەرشیفی هەفتانە و مانگانە
        run: |
          node - << 'JSEOF'
          const fs = require("fs");

          function isoDate(d) { return d.toISOString().slice(0,10); }

          // خوێندنەوەی index.json (رۆژانەکان)
          const idxPath = "archives/index.json";
          let dailyIdx = [];
          try { dailyIdx = JSON.parse(fs.readFileSync(idxPath,"utf8")); } catch(e){
              console.log("هێشتا index.json نییە");
              process.exit(0);
          }

          const today = new Date();
          const todayStr = isoDate(today);

          // ---- هەفتانە ----
          // ٧ رۆژی ڕابردوو کۆ بکە
          const weekStart = new Date(today);
          weekStart.setDate(today.getDate() - 6);
          const weekStartStr = isoDate(weekStart);

          const weekDays = dailyIdx.filter(d => d.date >= weekStartStr && d.date <= todayStr);
          if (weekDays.length > 0) {
              const weeklyData = {
                  type: "weekly",
                  week: `${weekStartStr}_${todayStr}`,
                  generatedAt: new Date().toISOString(),
                  totalVisits:  weekDays.reduce((s,d)=>s+(d.totalVisits||0),0),
                  totalClicks:  weekDays.reduce((s,d)=>s+(d.totalClicks||0),0),
                  days: weekDays.map(d=>({ date:d.date, visits:d.totalVisits||0, clicks:d.totalClicks||0 }))
              };

              const wPath = `archives/weekly_${weekStartStr}_${todayStr}.json`;
              fs.writeFileSync(wPath, JSON.stringify(weeklyData,null,2),"utf8");

              // نوێکردنەوەی weekly index
              const wIdxPath = "archives/weekly_index.json";
              let wIdx = [];
              try { wIdx = JSON.parse(fs.readFileSync(wIdxPath,"utf8")); } catch(e){}
              wIdx = wIdx.filter(x=>x.week!==weeklyData.week);
              wIdx.unshift({ week:weeklyData.week, generatedAt:weeklyData.generatedAt,
                  totalVisits:weeklyData.totalVisits, totalClicks:weeklyData.totalClicks,
                  days:weeklyData.days, file:wPath });
              if (wIdx.length>12) wIdx=wIdx.slice(0,12);
              fs.writeFileSync(wIdxPath, JSON.stringify(wIdx,null,2),"utf8");
              console.log("✅ ئەرشیفی هەفتانە:", wPath);
          }

          // ---- مانگانە ----
          const thisMonth = todayStr.slice(0,7); // "2026-04"
          const monthDays = dailyIdx.filter(d => d.date.startsWith(thisMonth));
          if (monthDays.length > 0) {
              const monthlyData = {
                  type: "monthly",
                  month: thisMonth,
                  generatedAt: new Date().toISOString(),
                  totalVisits:  monthDays.reduce((s,d)=>s+(d.totalVisits||0),0),
                  totalClicks:  monthDays.reduce((s,d)=>s+(d.totalClicks||0),0),
                  days: monthDays.map(d=>({ date:d.date, visits:d.totalVisits||0, clicks:d.totalClicks||0 }))
              };

              const mPath = `archives/monthly_${thisMonth}.json`;
              fs.writeFileSync(mPath, JSON.stringify(monthlyData,null,2),"utf8");

              // نوێکردنەوەی monthly index
              const mIdxPath = "archives/monthly_index.json";
              let mIdx = [];
              try { mIdx = JSON.parse(fs.readFileSync(mIdxPath,"utf8")); } catch(e){}
              mIdx = mIdx.filter(x=>x.month!==thisMonth);
              mIdx.unshift({ month:thisMonth, generatedAt:monthlyData.generatedAt,
                  totalVisits:monthlyData.totalVisits, totalClicks:monthlyData.totalClicks,
                  days:monthlyData.days, file:mPath });
              if (mIdx.length>24) mIdx=mIdx.slice(0,24);
              fs.writeFileSync(mIdxPath, JSON.stringify(mIdx,null,2),"utf8");
              console.log("✅ ئەرشیفی مانگانە:", mPath);
          }
          JSEOF

      - name: 📤 Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --staged --quiet || git commit -m "📦 ئەرشیفی هەفتانە/مانگانە — $(date -u +'%Y-%m-%d')"
          git push
