# ============================================================
#  .github/workflows/daily-clear.yml
#  هەر شەو کاتژمێر ١٢ (UTC+3):
#  ١. ئامارەکانی ئەمرۆ ئەرشیف دەبن لە GitHub
#  ٢. تەنها snapshot ەکان (دەقەکان) سڕێنەوە
#  ٣. ئامارەی کلیک، سەردان — ناسڕێنەوە
# ============================================================

name: 🌙 ئەرشیفی شەوانەی ئامارەکان

on:
  schedule:
    - cron: "0 21 * * *"   # 21:00 UTC = 12 شەو عێراق (UTC+3)
  workflow_dispatch:

jobs:
  archive-and-clear:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: 📡 ئامارەکان لە KV بخوێنەوە و ئەرشیف بکە
        env:
          CF_ACCOUNT_ID:   ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN:    ${{ secrets.CF_API_TOKEN }}
          CF_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          node - << 'JSEOF'
          const https = require("https");
          const fs    = require("fs");

          const ACCOUNT   = process.env.CF_ACCOUNT_ID;
          const TOKEN     = process.env.CF_API_TOKEN;
          const NAMESPACE = process.env.CF_NAMESPACE_ID;
          const BASE      = `https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/storage/kv/namespaces/${NAMESPACE}`;

          async function cfGet(key) {
              return new Promise((res, rej) => {
                  const req = https.request(`${BASE}/values/${encodeURIComponent(key)}`,
                      { headers: { Authorization: `Bearer ${TOKEN}` } },
                      (r) => { let b=""; r.on("data",d=>b+=d); r.on("end",()=>res(b)); });
                  req.on("error", rej); req.end();
              });
          }

          function safeJson(raw, def) { try { return JSON.parse(raw); } catch(e) { return def; } }
          function isoDate(d) { return d.toISOString().slice(0,10); }

          async function main() {
              const today = isoDate(new Date());
              const clicksListRaw = await cfGet("meta:clicks_list");
              const clickLabels   = safeJson(clicksListRaw, []);
              const clicks = {};
              for (const lbl of clickLabels) {
                  const v = await cfGet("click:" + lbl);
                  if (v && !isNaN(+v)) clicks[lbl] = +v;
              }
              const totalVisits   = +(await cfGet("meta:total_visits")   || "0");
              const totalTextarea = +(await cfGet("meta:total_textarea") || "0");

              const sessions = [];
              const snapshots = [];
              for (let i = 0; i < 1; i++) {
                  const d = new Date(); d.setDate(d.getDate()-i);
                  const ds = isoDate(d);
                  sessions.push( ...safeJson(await cfGet("visits:"+ds),    []) );
                  snapshots.push(...safeJson(await cfGet("snapshots:"+ds), []) );
              }

              const archive = {
                  date: today, generatedAt: new Date().toISOString(),
                  totalVisits, totalTextarea, clicks, sessions, snapshots
              };

              if (!fs.existsSync("archives")) fs.mkdirSync("archives");
              const fname = `archives/daily_${today}`;
              fs.writeFileSync(`${fname}.json`, JSON.stringify(archive, null, 2), "utf8");

              // CSV
              let csv = "Label,Count\n";
              Object.entries(clicks).sort((a,b)=>b[1]-a[1]).forEach(([l,c])=>{
                  csv += `"${l.replace(/"/g,'""')}",${c}\n`;
              });
              csv += "\n\nTime,City,Country,Device\n";
              sessions.forEach(s=>{ csv+=`"${s.time||""}","${s.city||""}","${s.country||""}","${s.device||""}"\n`; });
              fs.writeFileSync(`${fname}.csv`, csv, "utf8");

              // index.json نوێبکەرەوە
              const idxPath = "archives/index.json";
              let idx = [];
              try { idx = JSON.parse(fs.readFileSync(idxPath,"utf8")); } catch(e){}
              idx.unshift({ date: today, generatedAt: archive.generatedAt,
                  totalVisits, totalClicks: Object.values(clicks).reduce((s,v)=>s+v,0),
                  fileJson: `${fname}.json`, fileCsv: `${fname}.csv` });
              if (idx.length > 60) idx = idx.slice(0,60);
              fs.writeFileSync(idxPath, JSON.stringify(idx,null,2),"utf8");

              console.log("✅ ئەرشیف ئامادە کرا:", fname);
          }
          main().catch(e=>{ console.error(e); process.exit(1); });
          JSEOF

      - name: 📤 Commit ئەرشیفەکان
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archives/
          git diff --staged --quiet || git commit -m "🌙 ئەرشیفی شەوانە — $(date -u +'%Y-%m-%d')"
          git push

      - name: 🗑️ Snapshot ەکان بسڕەوە (دەقەکانی نووسراو تەنها)
        run: |
          RESPONSE=$(curl -s -X POST \
            "${{ secrets.SITE_URL }}/track" \
            -H "Content-Type: application/json" \
            -d '{"type":"snapshots_replace","snaps":[]}')
          echo "Snapshots cleared: $RESPONSE"
